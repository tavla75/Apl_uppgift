<header class="site-header">
  <nav class="navbar navbar-expand-lg container">
    <a class="brand" routerLink="/home-page">
      <span class="brand-mark"><i class="fa-solid fa-quote-left" aria-hidden="true"></i></span>
      <span>Citatboken</span>
    </a>
    @if (auth.currentSession(); as session) {
      <div class="section-menu">
        <button
          class="section-menu-toggle"
          type="button"
          aria-controls="section-menu-items"
          [attr.aria-expanded]="menuOpen"
          (click)="menuOpen = !menuOpen"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
          Meny
          <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>
        @if (menuOpen) {
          <nav class="section-menu-items" id="section-menu-items" aria-label="Huvudmeny">
            <a routerLink="/home-page" (click)="closeMenu()">
              <i class="fa-solid fa-book-open" aria-hidden="true"></i>Böcker
            </a>
            <a routerLink="/quotes" (click)="closeMenu()">
              <i class="fa-solid fa-quote-left" aria-hidden="true"></i>Mina citat
            </a>
          </nav>
        }
      </div>
      <div class="header-actions">
        <span class="welcome d-none d-sm-inline">Hej, {{ session.userName }}</span>
        <button class="btn logout-button btn-sm" type="button" (click)="logout()">
          <i class="fa-solid fa-arrow-right-from-bracket me-2" aria-hidden="true"></i>Logga ut
        </button>
      </div>
    }
    <button
      class="theme-toggle"
      type="button"
      [attr.aria-label]="theme.isDarkMode() ? 'Byt till ljust läge' : 'Byt till mörkt läge'"
      (click)="theme.toggleTheme()"
    >
      <i
        class="fa-solid"
        [class.fa-sun]="theme.isDarkMode()"
        [class.fa-moon]="!theme.isDarkMode()"
        aria-hidden="true"
      ></i>
      {{ theme.isDarkMode() ? 'Ljust läge' : 'Mörkt läge' }}
    </button>
  </nav>
</header>

<main class="container app-main">
  <router-outlet />
</main>
